<style>
:root{--bg:#FAFAF7;--p:#0A0A0A;--a:#0A0A0A;--y:#F1F1AF;--yd:#E8D96E;--ink:#0A0A0A;--m:#6B6B6B;--b:#EBEBE3;--ok:#2E7D32;--w:#B8860B;--d:#C62828}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 22px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav b{letter-spacing:2px;margin-right:auto;display:flex;align-items:center;gap:10px}nav img{width:38px;height:38px;border-radius:50%}.tabs button,.seg button{border:0;background:none;padding:8px 16px;border-radius:18px;font-weight:700;color:var(--m);cursor:pointer}
.tabs button.on,.seg button.on{background:var(--p);color:var(--y)}select,input{font:inherit;padding:7px 10px;border:1.5px solid var(--b);border-radius:9px;background:#fff}
main{max-width:1150px;margin:0 auto;padding:20px 14px 60px}.pn{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:18px}.sub,.note{color:var(--m);font-size:12.5px;margin:0 0 12px}.note{background:var(--bg);padding:10px 12px;border-radius:10px;margin-top:12px}
.ban{background:#FDFBF0;border:1px solid var(--yd);color:var(--ink);font-weight:700;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:12.5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ban .src{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);font-size:12px}.ban .src+.src::before{content:"+";color:var(--b);font-weight:800;margin-right:4px}.ban .meta{color:var(--m);font-size:12px;font-weight:600;margin-left:auto}.gt-logo{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:17px;letter-spacing:-0.4px;line-height:1}.hide{display:none}
table.g{width:100%;border-collapse:collapse;font-size:13px}.g th,.g td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left}.g th{font-size:11px;color:var(--m);text-transform:uppercase}
.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--ok)}.dn{color:var(--d)}.ly{font-size:10.5px;font-weight:800;color:var(--m);text-transform:uppercase;padding-top:10px!important}
.bd{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;text-transform:uppercase}.i{background:var(--y);color:#0A0A0A}.m{background:#0A0A0A;color:var(--y)}.im{background:#fff;border:1px solid #0A0A0A;color:#0A0A0A}
.ok{background:#DCFCE7;color:#166534}.w{background:#FEF3C7;color:#92400E}.no{background:#FEE2E2;color:#991B1B}.gy{background:#F1F5F9;color:#475569}
.hm{border-collapse:separate;border-spacing:2px;font-size:11px;min-width:640px}.hm th{font-size:10px;color:var(--m)}.hm th.now{background:var(--y);border-radius:4px}.hm th.t{text-decoration:underline}.hm td{width:40px;height:26px;text-align:center;border-radius:5px;font-weight:700;color:#0A0A0A}.hm .rh{text-align:left;font-size:12px;color:var(--ink);min-width:130px}.dim{opacity:.4}
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sc div{background:var(--bg);border-radius:12px;padding:14px;text-align:center}.sc b{display:block;font-size:26px}.sc span{font-size:11px;color:var(--m);font-weight:700;text-transform:uppercase}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lv div{border:2px solid var(--b);border-radius:12px;padding:14px;font-size:12.5px}.lv b{font-size:20px}.lA{background:var(--y);border-color:#0A0A0A!important}.lB{background:#FDFBF0;border-color:var(--yd)!important}
.ad{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}.ck{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}.ck label{border:1.5px solid var(--b);border-radius:9px;padding:6px 8px;font-size:12px;cursor:pointer}.ck label.on{border-color:#0A0A0A;background:var(--y)}
.rc{border:2px solid #0A0A0A;border-radius:14px;padding:14px;margin-bottom:10px}.rc .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}.act{padding:3px 12px;border-radius:9px;color:#fff;font-size:12px}.now{background:var(--d)}.prep{background:var(--a)}.watch{background:var(--w)}.none{background:#94A3B8}
.rc p{margin:6px 0;font-size:12.5px}.rc ul{margin:4px 0 0;padding-left:16px;color:var(--m);font-size:11.5px}pre{white-space:pre-wrap;background:#0F172A;color:#E2E8F0;padding:12px;border-radius:10px;font-size:12px}

T("h9",L("Toko Anda","Your store"));T("s9",L("Hanya input yang mengubah hasil: kategori, lead time, cover inventaris. Lokasi/harga/target tidak ada datanya, jadi tidak ditanya.","Only inputs that change the output: categories, lead time, inventory cover. No data on location/price/customer, so we don't ask."));

function momentum(){let h=`<table class="g"><tr><th></th><th class="n">🇰🇷 z</th><th class="n">🇮🇩 z</th></tr>`;
LAY.forEach(l=>{h+=`<tr><td colspan="3" class="ly">${ln(l)}</td></tr>`;R.items.filter(i=>i.layer==l).forEach(i=>{const k=i.momentum.kr_z,d=i.momentum.id_z;
h+=`<tr><td>${i.item} ${low(i)?bd("w",L("resolusi rendah","low-res")):""}</td><td class="n ${cz(k)}">${f2(k)}</td><td class="n ${cz(d)}">${f2(d)}</td></tr>`})});T("mom",h+"</table>")}
function heat(){const tg=[1,3,6].map(k=>(NOW+k)%12);let h="<tr><th></th>";for(let m=0;m<12;m++)h+=`<th class="${m==NOW?"now":tg.includes(m)?"t":""}">${mn(m)}</th>`;h+="</tr>";
LAY.forEach(l=>{h+=`<tr><td colspan="13" class="ly">${ln(l)}</td></tr>`;R.items.filter(i=>i.layer==l).forEach(i=>{const s=i.seasonality[src].interpretation,dm=s=="not_significant"||s=="insufficient_data";
h+=`<tr class="${dm?"dim":""}"><th class="rh">${i.item} <small>${s.replace("_"," ")}</small></th>`;i.seasonal_profile[src].forEach(v=>{const a=v==null?0:Math.min(1,Math.abs(v-1)/.6);
h+=`<td style="background:${v==null?"#F1F5F9":v>=1?`rgba(212,160,23,${a})`:`rgba(110,110,110,${a*.55})`}">${v==null?"":v.toFixed(2)}</td>`});h+="</tr>"})});T("hm",h)}
function outlook(){const only=$("agr").checked,hz=["+1","+3","+6"],ab={agree:"✅ agree",conflict:"⚠️ conflict",weak:"weak",insufficient_data:"—"};
const rows=R.items.filter(i=>lvl(i)!="C"&&(!only||i.expected_rise["+3"].agreement=="agree"));
let h=`<table class="g"><tr><th>Item</th><th>Level</th>${[1,3,6].map(k=>`<th class="n">🇮🇩 ${mn(NOW+k)}</th>`).join("")}<th class="n">🇰🇷 ${mn(NOW+3)}</th><th>KR vs ID</th></tr>`;
rows.forEach(i=>{const e=i.expected_rise;h+=`<tr><td>${i.item} ${lb(i)}${i.seasonality.id.interpretation=="weak"?" "+bd("w",L("lemah","weak")):""}</td><td>${lname(lvl(i))}</td>`+
hz.map(k=>`<td class="n ${e[k].id_delta>=.05?"up":e[k].id_delta<=-.05?"dn":""}">${f2(e[k].id_delta)}</td>`).join("")+`<td class="n">${f2(e["+3"].kr_delta)}</td><td>${bd(e["+3"].agreement=="agree"?"ok":e["+3"].agreement=="conflict"?"w":"gy",ab[e["+3"].agreement])}</td></tr>`});
h+="</table>"+(rows.length?"":`<p class="sub">${L("Tidak ada item.","No items.")}</p>`);
const c=R.items.filter(i=>lvl(i)=="C").map(i=>i.item).join(", ");T("out",h+`<p class="note"><b>${L("Level C — tidak ada outlook andal","Level C — no reliable outlook")}:</b> ${c}<br><small>${L("Puncak musiman Indonesia tidak signifikan setelah koreksi BH (atau amplitudonya terlalu kecil), jadi kami tidak memaksakan pola.","Indonesian seasonal peak not significant after BH correction (or amplitude too small), so we don't force a pattern.")}</small></p>`)}
function forecast(){const g={A:[],B:[],C:[]};R.items.forEach(i=>g[lvl(i)].push(i.item));const nm={A:lname("A"),B:lname("B")+L(" (puncak Indonesia andal)"," (reliable Indonesian peak)"),C:lname("C")};
T("lv",["A","B","C"].map(k=>`<div class="l${k}"><b>${g[k].length}</b>/${R.items.length}<br><b style="font-size:13px">${nm[k]}</b>${k=="B"?` · ${g.B.filter(x=>byId(x).seasonality.id.interpretation=="weak").length} ${L("lemah","weak")}`:""}<br><small>${g[k].join(", ")}</small></div>`).join(""));
const mh=R.multi_horizon,lg=X.lag;T("sc",`<div><b class="up">${R.analysis_status.forecast_validated}/${R.items.length}</b><span>${L("Tervalidasi 3 bln","Validated 3-mo")}</span></div><div><b class="dn">${mh.validated_after_bh}/${mh.n_tests}</b><span>${L("Tervalidasi setelah BH","Validated after BH")}</span></div><div><b class="dn">${lg?lg.fdr+"/"+lg.n:"—"}</b><span>${L("Lolos FDR lead-lag","Lead-lag FDR")}</span></div><div><b style="color:var(--w)">${lg?lg.placebo+"/"+lg.n:"—"}</b><span>${L("Peringatan placebo","Placebo warnings")}</span></div>`);
const c=byId("cotton"),s=c.forecast.skill,b=mh.best_single_result;T("cot",`<p>${bd("w",L("lolos uji awal 3 bln","passed initial 3-mo test"))} ${bd("no",L("gugur setelah BH (48 tes)","fails BH (48 tests)"))} z KR ${f2(c.momentum.kr_z)} · z ID ${f2(c.momentum.id_z)}</p><table class="g"><tr><th>${L("Bulan","Month")}</th><th class="n">${L("Indeks 0–100","Index 0–100")}</th></tr>${c.forecast.next_3_months.map(m=>`<tr><td>${m.month}</td><td class="n">${m.value.toFixed(2)}</td></tr>`).join("")}</table><p class="note">MASE ${s.persistence_mase.toFixed(3)} → ${s.best_candidate_mase.toFixed(3)} (${(s.rel_improvement_vs_persistence*100).toFixed(1)}%) · CI [${s.delta_ci_95.map(v=>v.toFixed(3)).join(", ")}] · ${L("menang","win")} ${(s.fold_win_rate*100).toFixed(0)}% · ${L("p mentah","raw p")} ${b.p_raw} → p BH ${b.p_adj_bh}. ${L("Indeks, bukan unit terjual.","Index values, not units sold.")}</p>`);
T("mh",mh.headline);let h=`<table class="g"><tr><th>Item</th>${mh.horizons.map(k=>`<th class="n">h=${k}</th>`).join("")}</tr>`;
R.items.forEach(i=>h+=`<tr><td>${i.item} ${lb(i)}</td>${mh.horizons.map(k=>{const p=mh.per_item_gate_pass[i.item][k];return `<td class="n ${p?"up":""}">${p?L("lolos mentah","raw pass"):"—"}</td>`}).join("")}</tr>`);T("mt",h+"</table>");
const dq=R.data_quality;T("lim","<ul>"+R.limitations.map(x=>`<li>${x}</li>`).join("")+`</ul><p class="note">${L("Kualitas data","Data quality")}: ${dq.mask_method}; ${dq.google_anomaly_months_masked.join(", ")}; ${L("diunduh ulang","re-downloaded")}: ${dq.anomaly_reconfirmed_by_redownload.join(", ")}. ${L("Cardigan: sinyal Google beresolusi rendah.","Cardigan: low-resolution Google signal.")}</p>`)}
function rec(i,lead,cov){const id=i.seasonality.id,mat=i.layer=="material";if(lvl(i)=="C")return{a:"none",o:9};
const mu=(MO.indexOf(id.peak_month)-NOW+12)%12,W=mu*4.345,sl=W-lead;let a=sl<=0?"now":sl<=13?"prep":"watch";if(lead>cov&&a=="watch")a="prep";if((id.interpretation=="weak"||mat)&&a=="now")a="prep";
return{a,mu,W,ob:mn(NOW+Math.max(0,Math.floor(sl/4.345))),q:mat?null:Math.max(-25,Math.min(25,Math.round((id.peak_idx-1)*100))),o:{now:0,prep:1,watch:2}[a],gap:Math.max(0,lead-cov),pk:id.peak_month}}
function advisor(){T("pr",Object.keys(PR).map(k=>`<button data-p="${k}" class="${k==persona?"on":""}">${PR[k].n}</button>`).join(""));
T("ck",R.items.map(i=>`<label class="${sel.has(i.item)?"on":""}"><input type="checkbox" data-i="${i.item}" ${sel.has(i.item)?"checked":""}> ${i.item}</label>`).join(""));
const lead=+$("lead").value||1,cov=+$("cov").value||1,AL={now:L("PESAN SEKARANG","ORDER NOW"),prep:L("SIAPKAN","PREPARE"),watch:L("PANTAU","WATCH"),none:L("TANPA OUTLOOK","NO OUTLOOK")};
const rs=[...sel].map(byId).filter(Boolean).map(i=>({i,r:rec(i,lead,cov)})).sort((x,y)=>x.r.o-y.r.o);
T("rec",rs.length?rs.map(({i,r})=>{const mat=i.layer=="material";return `<div class="rc"><div class="h"><span>${i.item} ${lb(i)} ${bd(lvl(i)=="A"?"w":"gy",lname(lvl(i)))}${low(i)?" "+bd("w",L("resolusi rendah","low-res")):""}</span><span class="act ${r.a}">${mat&&r.a!="none"?L("BAHAN: ","FABRIC: "):""}${AL[r.a]}</span></div>`+
(r.a=="none"?`<p>${L("Bukti musiman Indonesia tidak cukup andal. Jangan putuskan stok dari sinyal ini.","Indonesian seasonal evidence is not reliable enough. Don't base stock on this signal.")}</p>`:
`<p>${L("Puncak Indonesia","Indonesian peak")}: <b>${r.pk}</b> (${L("dalam","in")} ${r.mu} ${L("bln","mo")} ≈ ${Math.round(r.W)} ${L("mgg","wk")}) · lead ${lead} ${L("mgg → pesan paling lambat ±","wk → order by ~")}<b>${r.ob}</b>${r.gap?` · ⚠️ ${L("cover","cover")} ${cov} < lead ${lead}: ${L("ada celah stok","stock gap")} ${r.gap} ${L("mgg","wk")}`:""}</p>
<p>${r.q==null?L("Layer bahan: menginformasikan kategori produk, bukan kuantitas SKU.","Material layer: informs product categories, not SKU quantity."):`${L("Kuantitas di puncak","Quantity at peak")}: <b>${r.q>0?"+":""}${r.q}%</b> ${L("vs pesanan biasa","vs your usual order")} <small>(${L("heuristik, tidak tervalidasi","heuristic, not validated")})</small>`}</p>`)+
`<p>${i.business_action}</p><button class="bb" data-b="${i.item}">${L("Tanya Bob →","Ask Bob →")}</button><ul>${i.item_limitations.slice(-3).map(x=>`<li>${x}</li>`).join("")}</ul></div>`}).join(""):`<p class="sub">${L("Pilih minimal satu kategori.","Select at least one category.")}</p>`);bob()}
function bob(){const i=byId($("bsel").value||R.items[0].item),c=i.current_status,f=i.forecast;let t=[`**${i.item}** (layer: ${i.layer}, parent: ${i.parent||"—"})`,`Posisi bulan (per ${c.as_of_month}): ${c.month_position}`,`Puncak musiman KR: ${c.kr_peak_month}`,`Puncak musiman ID: ${c.id_peak_month||"tidak dapat diandalkan"}`];
if(f.available){t.push("Forecast (tervalidasi vs persistence): "+f.method_display);f.next_3_months.forEach(m=>t.push(`  - ${m.month}: ${m.value}`))}else t.push("Forecast: tidak tersedia. Model tidak terbukti mengalahkan baseline persistence di backtest.");
t.push("Rekomendasi: "+i.business_action,`Confidence: ${i.confidence.overall} (${i.confidence.rationale})`,"Sumber: Naver DataLab (KR) + Google Trends (ID). Keputusan akhir ada di pemilik toko.");$("bob").textContent=t.join("\n");const mh=R.multi_horizon,bs=mh.best_single_result;
T("bn",f.available&&bs&&bs.item==i.item?L(`Catatan UI (bukan keluaran Bob): hasil ini gugur saat diperluas ke ${mh.n_tests} tes (p BH ${bs.p_adj_bh}).`,`UI note (not Bob's output): this result fails when extended to ${mh.n_tests} tests (BH p ${bs.p_adj_bh}).`):"")}
function all(){texts();momentum();heat();outlook();forecast();advisor()}
function setP(p){persona=p;sel=new Set(PR[p].c);$("lead").value=PR[p].l;$("cov").value=PR[p].v}
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b==e.target));["o","f","a"].forEach(x=>$(x).classList.toggle("hide",x!=t))};
$("seg").onclick=e=>{if(!e.target.dataset.s)return;src=e.target.dataset.s;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b==e.target));heat()};
$("lang").onchange=e=>{lang=e.target.value;all()};$("agr").onchange=outlook;$("lead").oninput=$("cov").oninput=advisor;$("bsel").onchange=bob;$("rec").onclick=e=>{const b=e.target.dataset.b;if(b){$("bsel").value=b;bob();$("bsel").scrollIntoView({behavior:"smooth",block:"center"})}};
$("pr").onclick=e=>{if(e.target.dataset.p){setP(e.target.dataset.p);advisor()}};
$("ck").onchange=e=>{const i=e.target.dataset.i;e.target.checked?sel.add(i):sel.delete(i);advisor()};
$("bsel").innerHTML=R.items.map(i=>`<option>${i.item}</option>`).join("");$("bsel").value="cotton";setP("rina");all();if(location.hash=="#store")document.querySelector("#tabs [data-t=a]").click();
</script></body></html>
